<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>자리 찾기</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style id="app-style">
:root{
  --paper:#F3F5F4; --ink:#17252C; --muted:#5B6A71; --line:#17252C;
  --floor:#E0E6E4; --desk:#FFFFFF; --empty:#F3F5F4;
  --sign:#F5C518; --sign-ink:#17252C; --plate:#17252C; --plate-ink:#FFFFFF;
  --focus:#2F6FDB; --danger:#B3261E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1A1F; --ink:#E6ECEA; --muted:#93A3A9; --line:#C9D3D0;
    --floor:#1B2A30; --desk:#26363D; --empty:#16242A;
    --plate:#E6ECEA; --plate-ink:#0E1A1F; --focus:#7FA9F5; --danger:#F2B8B5;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1A1F; --ink:#E6ECEA; --muted:#93A3A9; --line:#C9D3D0;
  --floor:#1B2A30; --desk:#26363D; --empty:#16242A;
  --plate:#E6ECEA; --plate-ink:#0E1A1F; --focus:#7FA9F5; --danger:#F2B8B5;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 120px}

/* header */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 24px;align-items:end;margin-bottom:22px}
.top h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.01em}
.top .meta{margin:0;color:var(--muted);font-size:13px}
.tools{display:flex;gap:8px;align-items:center}
.btn{border:1.5px solid var(--line);background:transparent;border-radius:6px;padding:7px 14px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--floor)}
a.btn{text-decoration:none;color:inherit;display:inline-block}
.btn.primary{background:var(--plate);color:var(--plate-ink);border-color:var(--plate)}
.btn.primary:hover{filter:brightness(1.15)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:default}

/* finder */
.finder{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:18px 28px;align-items:stretch;margin-bottom:40px}
.field{align-self:start}
.field .box{position:relative}
.field input{width:100%;border:2px solid var(--line);border-radius:10px;background:var(--desk);
  padding:16px 18px 16px 50px;font-size:22px;font-weight:500;line-height:1.2;-webkit-appearance:none;appearance:none}
.field input::placeholder{color:var(--muted);font-weight:400;font-size:17px}
.field svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.2}
.hint{margin:10px 2px 0;color:var(--muted);font-size:13px}
kbd{font:inherit;font-size:12px;border:1px solid var(--muted);border-radius:4px;padding:0 5px}

.answer{min-height:96px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.answer .idle{color:var(--muted);font-size:15px;margin:0}
.answer .none{margin:0;font-size:15px}
.plate{display:inline-flex;align-items:stretch;border-radius:10px;overflow:hidden;background:var(--plate);color:var(--plate-ink);align-self:flex-start;max-width:100%}
.plate .who{background:var(--sign);color:var(--sign-ink);padding:14px 18px;display:flex;align-items:center;font-size:20px;font-weight:600;white-space:nowrap}
.plate .where{padding:10px 22px 12px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.plate .where small{font-size:12px;opacity:.75}
.plate .where b{font-size:40px;line-height:1.05;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.others{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--sign);border-color:var(--sign);color:var(--sign-ink);font-weight:600}
.chip span{color:var(--muted);margin-left:6px}
.chip.on span{color:inherit;opacity:.7}

/* rooms */
.rooms{display:flex;flex-direction:column;gap:48px}
.sec-label{margin:0 0 10px;color:var(--muted);font-size:13px}
.scroller{overflow-x:auto;overflow-y:visible;padding:10px 12px 12px;margin:-10px -12px -12px;-webkit-overflow-scrolling:touch}
.floor{display:inline-flex;flex-direction:column;min-width:min-content}
.frow{display:flex}
.frow.above{align-items:flex-end}
.frow.below{align-items:flex-start}
.frow > .room + .room{margin-left:-2.5px}
.gap{flex:none;align-self:stretch}
.corridor{height:46px;display:flex;align-items:center;justify-content:center;border-left:2.5px solid var(--line);border-right:2.5px solid var(--line);
  background:repeating-linear-gradient(90deg,transparent 0 18px,color-mix(in srgb,var(--line) 22%,transparent) 18px 30px) center/100% 1.5px no-repeat}
.corridor span{background:var(--paper);padding:0 12px;color:var(--muted);font-size:13px;letter-spacing:.3em}
.room{transition:opacity .2s;flex:none}
.room.dim{opacity:.32}
.rhead{display:flex;align-items:center;gap:10px;margin:0 0 8px;min-height:30px}
.room h2{margin:0;display:inline-block;font-size:26px;font-weight:700;line-height:1.1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.room.has-hit h2{box-shadow:inset 0 -.32em 0 var(--sign)}
.plan{position:relative;background:var(--floor);border:2.5px solid var(--line);flex:none;width:var(--pw)}
.plan svg.door{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.door path{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.room.place .plan{display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;
  background:repeating-linear-gradient(135deg,var(--paper) 0 7px,var(--floor) 7px 8.5px)}
.pname{font-size:14px;font-weight:600;background:var(--paper);padding:2px 6px;line-height:1.3;word-break:keep-all}
.room.place.has-hit .pname{background:var(--sign);color:var(--sign-ink)}
.room.focus .plan{box-shadow:0 0 0 3px var(--paper),0 0 0 7px var(--sign);z-index:2}
.desk{position:absolute;display:flex;align-items:center;justify-content:center;padding:1px;margin:0;
  background:var(--desk);border:1.5px solid var(--line);border-radius:0;font-size:13px;line-height:1.15;
  text-align:center;overflow:hidden;color:var(--ink);cursor:default}
.desk span{display:block;max-width:100%;overflow-wrap:anywhere}
.desk.v span{writing-mode:vertical-rl;max-height:100%;letter-spacing:.06em}
.desk.long{font-size:10.5px}
.desk.long span{letter-spacing:0}
.desk.empty{background:var(--empty);border-style:dashed}
.desk.hit{background:var(--sign);color:var(--sign-ink);font-weight:600;z-index:2}
.desk.focus{z-index:3;box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--sign)}
.desk.focus.pulse{animation:pulse 1.4s ease-out 2}
@keyframes pulse{0%{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--sign)}60%{box-shadow:0 0 0 3px var(--paper),0 0 0 18px transparent}100%{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--sign)}}
@media (prefers-reduced-motion:reduce){.desk.focus.pulse{animation:none}.room{transition:none}}
.room.focus{position:relative;z-index:2}

/* edit mode */
body.editing .plan{background-image:radial-gradient(circle,color-mix(in srgb,var(--line) 28%,transparent) 1px,transparent 1.2px);background-size:12px 12px}
body.editing .desk{cursor:grab;touch-action:none}
body.editing .desk:hover{outline:2px solid var(--focus);outline-offset:-1px}
.desk.sel{outline:3px solid var(--focus)!important;outline-offset:-1px;z-index:4}
.desk.dragging{cursor:grabbing;opacity:.85;z-index:5}
body.swapping .desk{cursor:crosshair}
.room .add{font-size:12px;padding:3px 9px}

.editbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--plate);color:var(--plate-ink);
  padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.editbar p{margin:0;font-size:14px;flex:1 1 220px;max-width:640px}
.editbar .btn{border-color:var(--plate-ink);color:var(--plate-ink)}
.editbar .btn:hover{background:rgba(127,127,127,.25)}
.editbar .btn.primary{background:var(--sign);border-color:var(--sign);color:var(--sign-ink)}

.panel{position:fixed;z-index:30;right:20px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:320px;max-width:calc(100% - 24px);
  background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 12px 32px rgba(0,0,0,.18)}
.panel h3{margin:0 0 10px;font-size:15px;font-weight:600}
.panel label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.panel input{width:100%;border:1.5px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--desk);font-size:17px}
.panel .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.panel .row .btn{font-size:13px;padding:6px 10px}
.panel .close{position:absolute;right:10px;top:8px;border:0;background:none;font-size:20px;line-height:1;cursor:pointer;padding:4px 6px;color:var(--muted)}

.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;background:var(--plate);color:var(--plate-ink);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px)}

/* phones: mini map + stacked rooms */
.preview,.browse-map{display:none}
.minimap{display:block;width:100%;height:auto;max-height:260px;margin:0 auto;font-family:inherit}
.mm-walk{fill:var(--paper);stroke:var(--muted);stroke-width:.03;stroke-dasharray:.08 .06}
.mm-room rect{fill:var(--floor);stroke:var(--line);stroke-width:.04}
.mm-room.place rect{fill:var(--paper)}
.mm-room text{font-size:.36px;font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.mm-room.place text{font-weight:500;fill:var(--muted)}
.mm-room text.sm{font-size:.28px}
.mm-room text.ml{font-size:.25px}
.mm-room.place text.ml tspan:first-child{font-weight:700;fill:var(--ink)}
.mm-room text tspan.sub{font-size:.22px}
.mm-room.on rect{fill:var(--sign)}
.mm-room.on text{fill:var(--sign-ink)}
[data-go]{cursor:pointer}
@media (max-width:760px){
  .kbd-hint,.meta-when{display:none}
  .preview{display:flex;flex-direction:column;gap:16px;margin-top:6px}
  .preview .rhead{display:none}
  .browse-map{display:block;background:var(--desk);border:1.5px solid var(--line);border-radius:10px;padding:12px}
  .browse-map .sec-label{margin:0 0 8px}
  .scroller{overflow:visible;margin:0;padding:0}
  .floor{display:flex;flex-direction:column;gap:32px;min-width:0}
  .frow{flex-direction:column;align-items:stretch!important;gap:32px}
  .frow > .room + .room{margin-left:0}
  .corridor,.gap,.room.place{display:none}
  .plan{width:min(100%, calc(var(--pw) * 1.4))}
  .desk{font-size:14px}
  .desk.long{font-size:11px}

  .wrap{padding:20px 16px 120px}
  .finder{grid-template-columns:1fr;margin-bottom:28px}
  .answer{min-height:0}
  .plate .where b{font-size:32px}
  .rooms{gap:32px 24px}
  .panel{left:12px;right:12px;width:auto}
}
</style>
</head>

  function miniText(p) {
    var lines = p.room.mini && p.room.mini.length ? p.room.mini : [shortName(p.room)];
    var cx = p.x + p.w / 2, cy = p.y + p.h / 2, lh = 0.34, top = cy - (lines.length - 1) * lh / 2;
    var cls = lines.length > 1 ? "ml" : (p.w < 1.3 ? "sm" : "");
    return '<text' + (cls ? ' class="' + cls + '"' : '') + '>' + lines.map(function (t, i) {
      return '<tspan x="' + cx + '" y="' + (top + i * lh) + '"' + (i > 0 ? ' class="sub"' : '') + '>' + esc(t) + '</tspan>';
    }).join("") + '</text>';
  }
  function miniMap(targetId, clickable) {
    var fp = floorPositions(); if (!fp) return "";
    var b = fp.box, pad = 0.08;
    var s = '<svg class="minimap" viewBox="' + (b[0] - pad) + ' ' + (b[1] - pad) + ' ' + (b[2] + 2 * pad) + ' ' + (b[3] + 2 * pad) + '" role="img" aria-label="층 안내도">';
    fp.walk.forEach(function (w) { s += '<rect class="mm-walk" x="' + w[0] + '" y="' + w[1] + '" width="' + w[2] + '" height="' + w[3] + '"/>'; });
    Object.keys(fp.pos).forEach(function (id) {
      var p = fp.pos[id], on = id === targetId;
      s += '<g class="mm-room' + (p.room.kind === "place" ? " place" : "") + (on ? " on" : "") + '"' + (clickable ? ' data-go="' + esc(id) + '"' : '') + '>' +
        '<rect x="' + p.x + '" y="' + p.y + '" width="' + p.w + '" height="' + p.h + '"/>' +
        miniText(p) + '</g>';
    });
    return s + '</svg>';
  }

  /* ---------- rooms ---------- */
  function doorPath(dr) {
    var x = dr.x, y = dr.y, r = dr.r, top = (y - r);
    if (dr.q === "dr") return "M" + x + " " + y + " L" + x + " " + (y + r) + " A" + r + " " + r + " 0 0 0 " + (x + r) + " " + y + " Z";
    if (dr.q === "dl") return "M" + x + " " + y + " L" + x + " " + (y + r) + " A" + r + " " + r + " 0 0 1 " + (x - r) + " " + y + " Z";
    if (dr.q === "ur") return "M" + x + " " + y + " L" + x + " " + top + " A" + r + " " + r + " 0 0 1 " + (x + r) + " " + y + " Z";
    return "M" + x + " " + y + " L" + x + " " + top + " A" + r + " " + r + " 0 0 0 " + (x - r) + " " + y + " Z";
  }
  function roomHtml(room, hits, hitRooms, anyQuery, preview) {
    var fk = focusKey && !editing && focusKey === room.id + "/";
    var cls = "room" + (room.kind === "place" ? " place" : "") + (anyQuery && !hitRooms[room.id] ? " dim" : "") +
      (hitRooms[room.id] && !editing ? " has-hit" : "") + (fk ? " focus" : "");
    var size = '--pw:' + (room.w * S) + 'px;aspect-ratio:' + room.w + '/' + room.h;
    if (room.kind === "place") {
      return '<section class="' + cls + '" data-room="' + esc(room.id) + '"><div class="plan" style="' + size + '"><span class="pname">' + esc(room.label) + '</span></div></section>';
    }
    var html = '<section class="' + cls + '" data-room="' + esc(room.id) + '"><div class="rhead"><h2>' + esc(room.label) + '</h2>' +
      (editing ? '<button class="btn add" type="button" data-add="' + esc(room.id) + '">책상 추가</button>' : '') + '</div>' +
      '<div class="plan" style="' + size + '">';
    if (room.door) html += '<svg class="door" viewBox="0 0 ' + room.w + ' ' + room.h + '" preserveAspectRatio="none" aria-hidden="true"><path vector-effect="non-scaling-stroke" d="' + doorPath(room.door) + '"/></svg>';
    room.desks.forEach(function (d) {
      var k = key(room, d), v = d.h > d.w;
      var c = "desk " + (v ? "v" : "h") + (d.name ? "" : " empty") +
        (d.name && /[A-Za-z]/.test(d.name) && d.name.length > 5 ? " long" : "") +
        (!editing && hits[k] ? " hit" : "") + (!editing && k === focusKey ? " focus" + (pulseNext ? " pulse" : "") : "") +
        (editing && selected === k ? " sel" : "");
      var tag = editing && !preview ? "button" : "div";
      html += "<" + tag + ' class="' + c + '" data-k="' + esc(k) + '"' + (editing ? ' type="button"' : "") +
        ' style="left:' + (d.x / room.w * 100) + "%;top:" + (d.y / room.h * 100) + "%;width:" + (d.w / room.w * 100) + "%;height:" + (d.h / room.h * 100) + '%"' +
        ' title="' + esc(d.name ? d.name + " (" + room.label + ")" : "빈 자리") + '"' +
        (editing ? ' aria-label="' + esc(room.label + " " + (d.name || "빈 자리")) + '"' : "") +
        "><span>" + esc(d.name) + "</span></" + tag + ">";
    });
    return html + "</div></section>";
  }
  function renderRooms(res) {
    res = res || [];
    var hits = {}, hitRooms = {};
    res.forEach(function (r) { if (r.desk) hits[key(r.room, r.desk)] = 1; hitRooms[r.room.id] = 1; });
    var anyQuery = norm(document.getElementById("q").value).length > 0 && res.length > 0 && !editing;
    var all = cur().rooms, used = {};
    var layout = cur().layout || { sections: [{ rows: [all.map(function (r) { return r.id; })] }] };
    var html = "";
    function section(sec) {
      var h = '<div class="section">' + (sec.label ? '<p class="sec-label">' + esc(sec.label) + '</p>' : '') + '<div class="scroller"><div class="floor">';
      var below = false;
      sec.rows.forEach(function (row) {
        if (row === "corridor") { below = true; h += '<div class="corridor"><span>복도</span></div>'; return; }
        h += '<div class="frow ' + (below ? "below" : "above") + '">';
        row.forEach(function (id) {
          if (id && typeof id === "object") { h += '<div class="gap" style="width:' + (id.gap * S) + 'px" aria-hidden="true"></div>'; return; }
          var r = findRoom(id); if (r) { used[id] = 1; h += roomHtml(r, hits, hitRooms, anyQuery); } });
        h += '</div>';
      });
      return h + '</div></div></div>';
    }
    if (!editing && cur().layout) html += '<div class="browse-map"><p class="sec-label">층 안내도. 방을 누르면 그 방으로 이동해요.</p>' + miniMap(null, true) + '</div>';
    layout.sections.forEach(function (sec) { html += section(sec); });
    var rest = all.filter(function (r) { return !used[r.id]; }).map(function (r) { return r.id; });
    if (rest.length) html += section({ rows: [rest] });
    var wrap = document.getElementById("rooms");
    wrap.innerHTML = html;
    Array.prototype.forEach.call(wrap.querySelectorAll("[data-go]"), function (g) {
      g.addEventListener("click", function () {
        var t = wrap.querySelector('.room[data-room="' + CSS.escape(g.getAttribute("data-go")) + '"]');
        if (t && getComputedStyle(t).display !== "none") t.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });
    pulseNext = false;
    if (editing) bindEditing(wrap);
  }

  /* ---------- editing ---------- */
  function startEdit() {
    draft = clone(data); editing = true; dirty = false; selected = null; swapFrom = null;
    document.body.classList.add("editing");
    renderAll();
  }
  function stopEdit() {
    if (dirty && !confirm("저장하지 않은 변경사항이 사라집니다. 편집을 끝낼까요?")) return;
    editing = false; draft = null; dirty = false; selected = null; swapFrom = null;
    document.body.classList.remove("editing", "swapping");
    renderAll();
  }
  function markDirty() { dirty = true; renderEditbar(); }
  function renderAll() { renderMeta(); update(); renderEditbar(); renderPanel(); }

  function renderEditbar() {
    var slot = document.getElementById("editbar-slot");
    if (!editing) { slot.innerHTML = ""; return; }
    var msg = swapFrom ? "맞바꿀 자리를 누르세요. 다른 방의 자리도 됩니다." :
      "책상을 눌러 이름을 바꾸고, 끌어서 위치를 옮기세요." + (dirty ? " 저장하지 않은 변경사항이 있습니다." : "") +
      (offlineEdit ? " 다 고쳤으면 파일로 내려받아 서버의 파일을 덮어쓰세요." : "");
    slot.innerHTML = '<div class="editbar" role="region" aria-label="편집"><p>' + esc(msg) + '</p>' +
      (swapFrom ? '<button class="btn" id="swap-cancel">맞바꾸기 취소</button>' :
        '<button class="btn" id="edit-cancel">편집 끝내기</button><button class="btn primary" id="edit-save"' + (dirty ? "" : " disabled") + '>' + (offlineEdit ? "파일로 내려받기" : "저장") + '</button>') + '</div>';
    var c = document.getElementById("edit-cancel"); if (c) c.addEventListener("click", stopEdit);
    var s = document.getElementById("edit-save"); if (s) s.addEventListener("click", save);
    var sc = document.getElementById("swap-cancel"); if (sc) sc.addEventListener("click", function () { swapFrom = null; document.body.classList.remove("swapping"); renderEditbar(); renderPanel(); });
  }

  function renderPanel() {
    var slot = document.getElementById("panel-slot");
    if (!editing || !selected || swapFrom) { slot.innerHTML = ""; return; }
    var p = selected.split("/"), room = findRoom(p[0]), d = findDesk(p[0], p[1]);
    if (!d) { slot.innerHTML = ""; return; }
    var v = d.h > d.w;
    slot.innerHTML = '<div class="panel" role="dialog" aria-label="자리 편집"><button class="close" id="p-close" aria-label="닫기">×</button>' +
      '<h3>' + esc(room.label) + ' 책상</h3>' +
      '<label for="p-name">이름</label><input id="p-name" autocomplete="off" placeholder="비워 두면 빈 자리">' +
      '<div class="row">' +
      '<button class="btn" id="p-swap">다른 자리와 맞바꾸기</button>' +
      '<button class="btn" id="p-clear">비우기</button>' +
      '<button class="btn" id="p-rot">' + (v ? "가로로 놓기" : "세로로 놓기") + '</button>' +
      '<button class="btn danger" id="p-del">책상 삭제</button>' +
      '</div></div>';
    var inp = document.getElementById("p-name");
    inp.value = d.name;
    inp.addEventListener("input", function () { d.name = inp.value.trim(); markDirty(); renderRooms(); });
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === "Escape") { selected = null; renderPanel(); renderRooms(); } });
    document.getElementById("p-close").addEventListener("click", function () { selected = null; renderPanel(); renderRooms(); });
    document.getElementById("p-clear").addEventListener("click", function () { d.name = ""; inp.value = ""; markDirty(); renderRooms(); });
    document.getElementById("p-swap").addEventListener("click", function () {
      swapFrom = selected; document.body.classList.add("swapping"); renderPanel(); renderEditbar();
    });
    document.getElementById("p-rot").addEventListener("click", function () {
      var w = d.w; d.w = d.h; d.h = w;
      d.x = r2(Math.min(Math.max(0, d.x), room.w - d.w)); d.y = r2(Math.min(Math.max(0, d.y), room.h - d.h));
      markDirty(); renderRooms(); renderPanel();
    });
    document.getElementById("p-del").addEventListener("click", function () {
      if (d.name && !confirm("‘" + d.name + "’ 책상을 삭제할까요?")) return;
      room.desks = room.desks.filter(function (x) { return x !== d; });
      selected = null; markDirty(); renderRooms(); renderPanel(); renderMeta();
    });
    if (window.matchMedia("(pointer:fine)").matches) inp.focus();
  }

  function bindEditing(wrap) {
    Array.prototype.forEach.call(wrap.querySelectorAll("[data-add]"), function (b) {
      b.addEventListener("click", function () {
        var room = findRoom(b.getAttribute("data-add"));
        var d = { id: "d" + Date.now().toString(36), w: 0.67, h: 0.29, name: "" };
        d.x = r2((room.w - d.w) / 2); d.y = r2((room.h - d.h) / 2);
        room.desks.push(d); selected = key(room, d); markDirty(); renderRooms(); renderPanel(); renderMeta();
      });
    });
    Array.prototype.forEach.call(wrap.querySelectorAll(".desk"), function (el) {
      var k = el.getAttribute("data-k"), p = k.split("/");
      var start = null;
      el.addEventListener("pointerdown", function (e) {
        if (swapFrom || e.button > 0) return;
        var room = findRoom(p[0]), d = findDesk(p[0], p[1]);
        var rect = el.parentNode.getBoundingClientRect();
        start = { x: e.clientX, y: e.clientY, dx: d.x, dy: d.y, ppi: rect.width / room.w, moved: false, room: room, d: d };
        el.setPointerCapture(e.pointerId);
      });
      el.addEventListener("pointermove", function (e) {
        if (!start) return;
        var mx = e.clientX - start.x, my = e.clientY - start.y;
        if (!start.moved && Math.abs(mx) + Math.abs(my) < 5) return;
        start.moved = true; el.classList.add("dragging");
        var room = start.room, d = start.d;
        var nx = Math.min(Math.max(0, start.dx + mx / start.ppi), room.w - d.w);
        var ny = Math.min(Math.max(0, start.dy + my / start.ppi), room.h - d.h);
        start.nx = r2(nx); start.ny = r2(ny);
        el.style.left = (start.nx / room.w * 100) + "%"; el.style.top = (start.ny / room.h * 100) + "%";
      });
      function end() {
        if (!start) return;
        if (start.moved) { justDragged = true; setTimeout(function () { justDragged = false; }, 0); }
        var s = start; start = null;
        if (s.moved) {
          if (s.nx !== undefined) { s.d.x = s.nx; s.d.y = s.ny; markDirty(); }
          selected = k; renderRooms(); renderPanel();
        }
      }
      el.addEventListener("pointerup", end);
      el.addEventListener("pointercancel", function () { if (start) { start = null; renderRooms(); } });
      el.addEventListener("click", function () {
        if (justDragged || el.classList.contains("dragging")) return;
        if (swapFrom) {
          if (swapFrom !== k) {
            var a = swapFrom.split("/"), da = findDesk(a[0], a[1]), db = findDesk(p[0], p[1]);
            var t = da.name; da.name = db.name; db.name = t; markDirty();
            toast((db.name || "빈 자리") + " ↔ " + (da.name || "빈 자리") + " 맞바꿨습니다.");
          }
          swapFrom = null; selected = k; document.body.classList.remove("swapping");
          renderRooms(); renderEditbar(); renderPanel(); return;
        }
        selected = selected === k ? null : k; renderRooms(); renderPanel();
      });
      el.addEventListener("keydown", function (e) {
        if (!/^Arrow/.test(e.key)) return;
        e.preventDefault();
        var room = findRoom(p[0]), d = findDesk(p[0], p[1]), st = e.shiftKey ? 0.1 : 0.02;
        if (e.key === "ArrowLeft") d.x -= st; if (e.key === "ArrowRight") d.x += st;
        if (e.key === "ArrowUp") d.y -= st; if (e.key === "ArrowDown") d.y += st;
        d.x = r2(Math.min(Math.max(0, d.x), room.w - d.w)); d.y = r2(Math.min(Math.max(0, d.y), room.h - d.h));
        markDirty(); selected = k; renderRooms(); var n = document.querySelector('.desk[data-k="' + CSS.escape(k) + '"]'); if (n) n.focus();
      });
    });
  }

  var toastTimer;
  function toast(msg, ms) {
    var t = document.querySelector(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
    t.textContent = msg; clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.remove(); }, ms || 2600);
  }

  /* ---------- save = publish a new version of this page ---------- */
  function safeJson(o) { return JSON.stringify(o).replace(/</g, "\\u003c").replace(/\u2028/g, "\\u2028").replace(/\u2029/g, "\\u2029"); }
  function buildPage(d) {
    var css = document.getElementById("app-style").textContent;
    var js = document.getElementById("app-script").textContent;
    return "<!doctype html>\n<html lang=\"ko\">\n<head>\n" + HEAD + "\n<style id=\"app-style\">" + css + "</style>\n</head>\n<body>\n<div id=\"app\"></div>\n" +
      "<script id=\"seat-data\" type=\"application/json\">" + safeJson(d) + SCRIPT_END + "\n" +
      "<script id=\"app-script\">" + js + SCRIPT_END + "\n</body>\n</html>\n";
  }
  function save() {
    var btn = document.getElementById("edit-save");
    var next = clone(draft); next.updatedAt = new Date().toISOString();
    next.rooms.forEach(function (r) { r.desks.forEach(function (d) { d.name = (d.name || "").trim(); }); });
    if (!artifactNs) {
      if (!offlineEdit) return;
      var blob = new Blob([buildPage(next)], { type: "text/html" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "seat-finder.html";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      data = next; dirty = false;
      toast("파일을 내려받았습니다. 서버의 기존 파일을 이 파일로 덮어쓰면 반영됩니다.", 5000);
      renderEditbar(); renderMeta();
      return;
    }
    if (btn) { btn.disabled = true; btn.textContent = "저장 중…"; }
    artifactNs.publish(buildPage(next)).then(function () {
      dirty = false; toast("저장했습니다. 새 배치를 불러옵니다.");
    }, function (err) {
      var code = err && err.code;
      if (code === "conflict") { dirty = false; toast("다른 사람이 먼저 저장했습니다. 최신 배치를 불러오니 다시 편집해 주세요.", 5000); return; }
      if (code === "not_writer" || code === "not_granted" || code === "not_declared" || code === "consent_required" || code === "capability_disabled" || code === "capability_removed") {
        canWrite = false; dirty = false; editing = false; draft = null; document.body.classList.remove("editing", "swapping");
        renderAll(); toast("이 페이지는 보기 전용입니다. 자리를 바꾸려면 소유자에게 편집 권한을 요청하세요.", 5000); return;
      }
      if (code === "rate_limited") toast("저장이 너무 잦습니다. 잠시 후 다시 저장하세요.", 4000);
      else toast("저장하지 못했습니다. 잠시 후 다시 시도하세요." + (code ? " (" + code + ")" : ""), 4000);
      if (btn) { btn.disabled = false; btn.textContent = "저장"; }
    });
  }
  window.addEventListener("beforeunload", function (e) { if (editing && dirty) { e.preventDefault(); e.returnValue = ""; } });

  /* ---------- boot ---------- */
  buildShell();
  renderAll();

  if (!(window.claude && typeof window.claude.use === "function")) {
    if (/(^|[?&])edit(=|&|$)/.test(location.search)) { offlineEdit = true; canWrite = true; renderMeta(); }
  }
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(function (ns) {
      if (!ns) return;
      artifactNs = ns;
      return window.claude.use("user").then(function (u) {
        if (!u) return true;
        return u.canEdit();
      }, function () { return true; }).then(function (ok) {
        canWrite = !!ok; renderMeta();
      });
    }).catch(function () { });
  }
})();
</script>
</body>
</html>
